; Service Monitor — LILYGO T-Display S3 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
;
; Envs:
;   t-display-s3       USB upload (default)
;   t-display-s3-ota   Wi-Fi upload via ArduinoOTA (espota)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
; OTA:     pio run -e t-display-s3-ota -t upload

[platformio]
default_envs = t-display-s3

[env]
; espressif32 7.1.3 ships Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4).
platform = platformio/espressif32@7.1.3
; Official PlatformIO board definition (also used by LILYGO's own T-Display-S3 repo):
; 16 MB QIO flash, OPI PSRAM, native USB CDC, default_16MB.csv (two OTA app slots).
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; LVGL picks up include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

[env:t-display-s3]
upload_protocol = esptool

[env:t-display-s3-ota]
upload_protocol = espota
upload_port = service-monitor.local
; If OTA_PASSWORD is set in secrets.h, export the same value before uploading:
;   export SERVICE_MONITOR_OTA_PASSWORD='...'
upload_flags =
    --auth=${sysenv.SERVICE_MONITOR_OTA_PASSWORD}
